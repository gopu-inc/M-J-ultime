<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&J Ultimate App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #007bff;
            --dark: #121212;
            --light: #ffffff;
            --gray: #2c2c2c;
            --text-gray: #a0a0a0;
            --nav-height: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--dark); color: var(--light); padding-bottom: var(--nav-height); }

        /* --- NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: var(--nav-height);
            background: var(--dark); border-top: 1px solid var(--gray);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { color: var(--text-gray); font-size: 1.5rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        /* --- SECTIONS (Vues) --- */
        .section { display: none; padding: 20px; min-height: 100vh; }
        .section.active { display: block; }

        /* --- AUTH FORMS --- */
        .auth-container { max-width: 400px; margin: 50px auto; text-align: center; }
        input, textarea {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid var(--gray); background: var(--gray); color: white;
        }
        button {
            width: 100%; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .link { color: var(--primary); cursor: pointer; margin-top: 10px; display: block; }

        /* --- FEED VIDEO --- */
        .video-card {
            background: var(--gray); border-radius: 12px; overflow: hidden; margin-bottom: 20px;
        }
        .video-player { width: 100%; max-height: 500px; background: black; }
        .video-info { padding: 15px; }
        .user-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .stats { display: flex; gap: 15px; margin-top: 10px; color: var(--text-gray); }

        /* --- CHAT --- */
        .chat-list-item {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            border-bottom: 1px solid var(--gray); cursor: pointer;
        }
        .message-area {
            height: calc(100vh - 180px); overflow-y: auto; padding-bottom: 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; }
        .msg.sent { align-self: flex-end; background: var(--primary); }
        .msg.received { align-self: flex-start; background: var(--gray); }
        .chat-input-area {
            position: fixed; bottom: var(--nav-height); left: 0; width: 100%;
            padding: 10px; background: var(--dark); display: flex; gap: 10px;
        }

        /* --- PROFIL --- */
        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid var(--primary); }
        .profile-stats { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
        .stat-box { text-align: center; }
        .stat-num { font-weight: bold; font-size: 1.2rem; }
        .stat-label { font-size: 0.8rem; color: var(--text-gray); }

        /* --- NOTIFICATIONS --- */
        #toast {
            position: fixed; top: 20px; right: 20px; background: var(--primary);
            padding: 15px; border-radius: 8px; z-index: 2000; display: none;
        }
    </style>
</head>
<body>

    <div id="toast">Message reçu</div>

    <div id="auth-section" class="section active">
        <div class="auth-container">
            <h1>M&J Ultimate</h1>
            <p>Connectez-vous pour continuer</p>
            
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Nom d'utilisateur" required>
                <input type="password" id="login-password" placeholder="Mot de passe" required>
                <button type="submit">Se connecter</button>
            </form>
            
            <span class="link" onclick="toggleAuth('register')">Pas de compte ? S'inscrire</span>
        </div>
    </div>

    <div id="register-section" class="section">
        <div class="auth-container">
            <h1>Inscription</h1>
            <form id="register-form">
                <input type="text" id="reg-username" placeholder="Nom d'utilisateur (a-z, 0-9)" required>
                <input type="email" id="reg-email" placeholder="Email (optionnel)">
                <input type="password" id="reg-password" placeholder="Mot de passe (min 6 chars)" required>
                <button type="submit">S'inscrire</button>
            </form>
            <span class="link" onclick="toggleAuth('login')">Déjà un compte ? Se connecter</span>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        
        <div id="home-section" class="section">
            <h2>Explorer</h2>
            <div id="video-feed">
                <p style="text-align:center; margin-top:50px;">Chargement...</p>
            </div>
        </div>

        <div id="search-section" class="section">
            <input type="text" id="search-input" placeholder="Rechercher des utilisateurs..." onkeyup="searchUsers()">
            <div id="search-results"></div>
        </div>

        <div id="upload-section" class="section">
            <h2>Publier une vidéo</h2>
            <form id="upload-form">
                <div style="border: 2px dashed var(--gray); padding: 40px; text-align: center; margin-bottom: 20px; border-radius: 10px;">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary);"></i>
                    <br><br>
                    <input type="file" id="video-file" accept="video/*" required style="display: none;">
                    <button type="button" onclick="document.getElementById('video-file').click()">Choisir une vidéo</button>
                    <p id="file-name" style="margin-top: 10px; color: var(--text-gray);"></p>
                </div>
                <textarea id="video-desc" placeholder="Description de votre vidéo..."></textarea>
                <button type="submit" id="upload-btn">Publier</button>
            </form>
        </div>

        <div id="chat-list-section" class="section">
            <h2>Messages</h2>
            <div id="conversations-list"></div>
        </div>

        <div id="chat-room-section" class="section" style="padding-bottom: 70px;">
            <div style="display: flex; align-items: center; margin-bottom: 10px;">
                <button onclick="showSection('chat-list-section')" style="width: auto; padding: 5px 15px; margin: 0; margin-right: 10px;">←</button>
                <h3 id="chat-with-username">Chat</h3>
            </div>
            <div id="messages-container" class="message-area"></div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Votre message..." style="margin: 0;">
                <button onclick="sendMessage()" style="width: 50px; margin: 0;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="profile-section" class="section">
            <div id="profile-content"></div>
            <button onclick="logout()" style="background: #dc3545; margin-top: 20px;">Déconnexion</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showSection('home-section')"><i class="fas fa-home"></i></div>
            <div class="nav-item" onclick="showSection('search-section')"><i class="fas fa-search"></i></div>
            <div class="nav-item" onclick="showSection('upload-section')"><i class="fas fa-plus-square"></i></div>
            <div class="nav-item" onclick="showSection('chat-list-section')"><i class="fas fa-comment-alt"></i></div>
            <div class="nav-item" onclick="showSection('profile-section')"><i class="fas fa-user"></i></div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const API_URL = "http://127.0.0.1:8000"; // Changer si le serveur est ailleurs
        const WS_URL = "ws://127.0.0.1:8000/ws";
        
        let token = localStorage.getItem('token');
        let currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        let currentChatUserId = null;
        let socket = null;

        // INIT
        if (token) {
            initApp();
        }

        // --- AUTHENTIFICATION ---

        function toggleAuth(view) {
            document.getElementById('auth-section').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('register-section').style.display = view === 'register' ? 'block' : 'none';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('login-username').value);
            formData.append('password', document.getElementById('login-password').value);

            try {
                const res = await fetch(`${API_URL}/token`, { method: 'POST', body: formData });
                if (!res.ok) throw new Error('Échec connexion');
                const data = await res.json();
                
                token = data.access_token;
                currentUser = { id: data.user_id, username: data.username, avatar_url: data.avatar_url };
                
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(currentUser));
                
                initApp();
            } catch (err) {
                alert(err.message);
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('reg-username').value,
                password: document.getElementById('reg-password').value,
                email: document.getElementById('reg-email').value || null
            };

            try {
                const res = await fetch(`${API_URL}/api/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Erreur");
                }
                alert("Compte créé ! Connectez-vous.");
                toggleAuth('login');
            } catch (err) {
                alert("Erreur: " + err.message);
            }
        });

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function initApp() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            connectWebSocket();
            loadFeed();
            loadProfile();
        }

        // --- NAVIGATION ---
        function showSection(id) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // Highlight nav item
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            // Logique simple pour highlight (optionnel)
            
            if (id === 'home-section') loadFeed();
            if (id === 'chat-list-section') loadConversations();
            if (id === 'profile-section') loadProfile();
        }

        // --- WEBSOCKET ---
        function connectWebSocket() {
            if (!currentUser.id) return;
            socket = new WebSocket(`${WS_URL}/${currentUser.id}`);
            
            socket.onopen = () => console.log("WS Connecté");
            
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'new_message') {
                    showToast(`Message de ${data.sender_username}`);
                    if (currentChatUserId === data.sender_id) {
                        appendMessage(data, 'received');
                    } else {
                        // Refresh converastion list indicator if open
                    }
                }
            };
            
            socket.onclose = () => setTimeout(connectWebSocket, 3000); // Reconnexion
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // --- FEED & VIDEOS ---
        async function loadFeed() {
            const res = await fetch(`${API_URL}/api/feed`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const videos = await res.json();
            const container = document.getElementById('video-feed');
            container.innerHTML = '';

            videos.forEach(v => {
                const div = document.createElement('div');
                div.className = 'video-card';
                div.innerHTML = `
                    <div class="user-head" style="padding:10px;">
                        <img src="${v.avatar_url || 'https://via.placeholder.com/40'}" class="avatar">
                        <b>${v.username}</b>
                    </div>
                    <video src="${v.video_url}" class="video-player" controls loop></video>
                    <div class="video-info">
                        <p>${v.description}</p>
                        <div class="stats">
                            <span><i class="fas fa-heart"></i> ${v.likes}</span>
                            <span><i class="fas fa-eye"></i> ${v.views}</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- UPLOAD ---
        document.getElementById('video-file').addEventListener('change', function() {
            document.getElementById('file-name').innerText = this.files[0] ? this.files[0].name : '';
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('upload-btn');
            btn.innerText = "Téléchargement en cours...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('video', document.getElementById('video-file').files[0]);
            formData.append('description', document.getElementById('video-desc').value);

            try {
                const res = await fetch(`${API_URL}/api/videos/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                if (!res.ok) throw new Error("Erreur upload");
                alert("Vidéo publiée avec succès !");
                document.getElementById('upload-form').reset();
                showSection('home-section');
            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerText = "Publier";
                btn.disabled = false;
            }
        });

        // --- CHAT ---
        async function loadConversations() {
            const res = await fetch(`${API_URL}/api/messages/conversations`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const convs = await res.json();
            const list = document.getElementById('conversations-list');
            list.innerHTML = '';

            convs.forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-list-item';
                div.innerHTML = `
                    <img src="${c.avatar_url || 'https://via.placeholder.com/50'}" class="avatar">
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between;">
                            <b>${c.username}</b>
                            <small>${new Date(c.last_message_time).toLocaleTimeString()}</small>
                        </div>
                        <p style="color:var(--text-gray);">${c.last_message || '...'}</p>
                    </div>
                    ${c.unread_count > 0 ? `<span style="background:red; border-radius:50%; padding:2px 6px; font-size:12px;">${c.unread_count}</span>` : ''}
                `;
                div.onclick = () => openChat(c.user_id, c.username);
                list.appendChild(div);
            });
        }

        async function openChat(userId, username) {
            currentChatUserId = userId;
            document.getElementById('chat-with-username').innerText = username;
            showSection('chat-room-section');
            
            const res = await fetch(`${API_URL}/api/messages/${userId}?limit=50`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const msgs = await res.json(); // Le backend les renvoie inversés pour l'affichage
            
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            
            // Le backend renvoie du plus récent au plus ancien, on doit inverser pour afficher
            // Mais dans ton code backend `reversed(messages)` est fait, donc on les reçoit chronologiquement ?
            // On va assumer qu'on les reçoit dans l'ordre chronologique pour l'affichage
            
            msgs.forEach(m => {
                appendMessage(m, m.sender_id === currentUser.id ? 'sent' : 'received');
            });
            scrollToBottom();
        }

        function appendMessage(msg, type) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = msg.content;
            container.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('messages-container');
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content || !currentChatUserId) return;

            input.value = ''; // Clear immediately
            
            // Optimistic UI update
            appendMessage({ content: content }, 'sent');

            try {
                await fetch(`${API_URL}/api/messages/send`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        receiver_id: currentChatUserId,
                        content: content,
                        type: 'text'
                    })
                });
                // Le message est aussi renvoyé par le socket "message_sent", on ignore ici pour éviter doublon
            } catch (err) {
                console.error(err);
                alert("Erreur envoi");
            }
        }

        // --- SEARCH ---
        async function searchUsers() {
            const q = document.getElementById('search-input').value;
            if (q.length < 2) return;

            const res = await fetch(`${API_URL}/api/search?q=${q}&type=users`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const users = await res.json();
            const div = document.getElementById('search-results');
            div.innerHTML = '';
            
            users.forEach(u => {
                const el = document.createElement('div');
                el.className = 'chat-list-item';
                el.innerHTML = `
                    <img src="${u.avatar_url || 'https://via.placeholder.com/40'}" class="avatar">
                    <b>${u.username}</b>
                    <button style="width:auto; margin-left:auto; padding:5px 10px;" onclick="openChat('${u.id}', '${u.username}')">Message</button>
                `;
                div.appendChild(el);
            });
        }

        // --- PROFILE ---
        async function loadProfile() {
            const res = await fetch(`${API_URL}/api/users/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            
            document.getElementById('profile-content').innerHTML = `
                <div class="profile-header">
                    <img src="${data.avatar_url || 'https://via.placeholder.com/100'}" class="profile-avatar">
                    <h2>${data.username}</h2>
                    <p>${data.bio || "Pas de bio"}</p>
                </div>
                <div class="profile-stats">
                    <div class="stat-box">
                        <div class="stat-num">${data.followers_count}</div>
                        <div class="stat-label">Abonnés</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num">${data.following_count}</div>
                        <div class="stat-label">Abonnements</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num">${data.likes_received}</div>
                        <div class="stat-label">J'aime</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
