<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>M&J Ultimate</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-overlay"></div>

    <div id="splash-screen" class="screen flex-center active">
        <div class="logo-anim">
            M&J<span class="dot">.</span>
        </div>
    </div>

    <div id="auth-screen" class="screen hidden">
        <div class="auth-container">
            <h1>M&J <span class="gradient-text">Hub</span></h1>
            <p class="subtitle">La plateforme ultime.</p>
            
            <form id="auth-form" onsubmit="event.preventDefault();">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Nom d'utilisateur" required>
                </div>
                <div class="input-group hidden" id="email-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Mot de passe" required>
                </div>
                
                <button id="btn-login" class="btn-main" onclick="app.login()">Se connecter</button>
                <button id="btn-register" class="btn-main hidden" onclick="app.register()">Créer un compte</button>
            </form>
            
            <div class="auth-switch">
                <span id="switch-text">Pas de compte ?</span>
                <a href="#" onclick="ui.toggleAuthMode()">S'inscrire</a>
            </div>
        </div>
    </div>

    <div id="app-screen" class="screen hidden">
        
        <header class="app-header">
            <div class="live-indicator hidden" id="top-live-badge" onclick="ui.goToSection('lives')">LIVE</div>
            <div class="tabs-header">
                <span class="tab active" onclick="app.loadFeed()">Pour toi</span>
                <span class="tab" onclick="ui.goToSection('lives')">Lives</span>
            </div>
            <i class="fas fa-search search-icon" onclick="ui.openModal('search-modal')"></i>
        </header>

        <main id="main-container">
            
            <section id="feed-section" class="active">
                <div id="video-scroller" class="snap-container">
                    <div class="skeleton-feed flex-center">Chargement...</div>
                </div>
            </section>

            <section id="lives-section" class="hidden">
                <div class="section-title">Lives en cours</div>
                <div id="lives-grid" class="grid-layout"></div>
                <button class="fab-live" onclick="app.startLiveSetup()">
                    <i class="fas fa-video"></i> Go Live
                </button>
            </section>

            <section id="chat-section" class="hidden">
                <div class="chat-list-header">Messages</div>
                <div id="conversations-list"></div>
            </section>

            <section id="profile-section" class="hidden">
                <div id="my-profile-container"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <div class="nav-btn active" onclick="ui.goToSection('feed')"><i class="fas fa-home"></i></div>
            <div class="nav-btn" onclick="ui.goToSection('lives')"><i class="fas fa-broadcast-tower"></i></div>
            <div class="nav-btn add-btn" onclick="ui.openModal('upload-modal')"><i class="fas fa-plus"></i></div>
            <div class="nav-btn" onclick="ui.goToSection('chat')">
                <div class="badge-icon">
                    <i class="fas fa-comment-dots"></i>
                    <span id="msg-badge" class="hidden">0</span>
                </div>
            </div>
            <div class="nav-btn" onclick="ui.goToSection('profile')"><i class="fas fa-user"></i></div>
        </nav>
    </div>

    <div id="upload-modal" class="modal hidden">
        <div class="modal-content bottom-sheet">
            <div class="modal-header">
                <h3>Nouvelle Publication</h3>
                <span class="close-modal" onclick="ui.closeModal('upload-modal')">&times;</span>
            </div>
            <div class="upload-area" onclick="document.getElementById('video-file').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Appuyez pour choisir une vidéo</p>
                <input type="file" id="video-file" accept="video/*" hidden onchange="ui.handleFileSelect(this)">
            </div>
            <div id="file-preview" class="hidden"></div>
            <textarea id="video-desc" placeholder="Ajouter une description... #Viral"></textarea>
            <div class="toggle-row">
                <span>Public</span>
                <input type="checkbox" id="is-public" checked>
            </div>
            <button class="btn-main" onclick="app.uploadVideo()">Publier</button>
            <div id="upload-progress" class="progress-bar hidden"><div class="fill"></div></div>
        </div>
    </div>

    <div id="edit-profile-modal" class="modal hidden">
        <div class="modal-content bottom-sheet">
            <h3>Modifier le profil</h3>
            <div class="avatar-edit">
                <img id="edit-avatar-preview" src="" class="avatar-large">
                <div class="edit-icon" onclick="document.getElementById('avatar-file').click()">
                    <i class="fas fa-camera"></i>
                </div>
                <input type="file" id="avatar-file" accept="image/*" hidden onchange="ui.previewAvatar(this)">
            </div>
            <input type="text" id="edit-bio" placeholder="Nouvelle bio...">
            <button class="btn-main" onclick="app.updateProfile()">Enregistrer</button>
            <button class="btn-sec" onclick="ui.closeModal('edit-profile-modal')">Annuler</button>
        </div>
    </div>

    <div id="search-modal" class="modal hidden">
        <div class="modal-content full-screen-modal">
            <div class="search-header">
                <i class="fas fa-arrow-left" onclick="ui.closeModal('search-modal')"></i>
                <input type="text" id="search-input" placeholder="Rechercher..." onkeyup="app.search(this.value)">
            </div>
            <div id="search-results"></div>
        </div>
    </div>

    <div id="chat-view" class="sub-screen hidden">
        <div class="chat-header-bar">
            <i class="fas fa-arrow-left" onclick="ui.closeChat()"></i>
            <div class="chat-user-info">
                <img id="chat-header-avatar" src="">
                <span id="chat-header-username">User</span>
            </div>
        </div>
        <div id="messages-container"></div>
        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="Envoyer un message...">
            <button onclick="app.sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="live-player-overlay" class="sub-screen hidden bg-black">
        <div class="live-overlay-ui">
            <button class="close-live" onclick="ui.closeLive()">&times;</button>
            <div class="live-status-tag">EN DIRECT</div>
        </div>
        <video id="main-live-video" playsinline webkit-playsinline></video>
        <div id="live-chat-overlay" class="live-chat-scroller"></div>
        <div class="live-input-bar">
            <input type="text" id="live-comment-input" placeholder="Commenter...">
            <button onclick="app.sendLiveComment()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
